name: CI

# Cheap insurance for the plugin's executable surface. The hook scripts run on
# every installer's machine at session start and intercept their Edit/Write
# calls, so a silent bash typo is high blast radius. Catching it pre-merge is
# much nicer than catching it in someone else's terminal.
#
# Fanout jobs do the actual work, and a single `ci-required` job aggregates them
# via `needs:`. Adding a new gating check means adding it to `ci-required.needs`
# here — the branch-protection config only ever names the umbrella, so it never
# has to learn about individual jobs.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are on top of the defaults so that applying
    # `no-changelog` re-runs `changelog-fragment` with a payload that contains
    # it. Without them the label is unusable as an escape hatch: the payload is
    # a snapshot from PR creation, and re-running a check replays that same
    # payload, so a label added after the gate failed would never be seen.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all .sh files
        # Bring our own shellcheck (the pre-installed one on ubuntu-latest
        # tracks the runner image's release cadence, which lags upstream by
        # months). Pin an exact version so the CI signal is stable across
        # runner-image updates and a future shellcheck-action release can't
        # silently flap the check.
        #
        # Source-following and SCRIPTDIR resolution come from .shellcheckrc, so
        # the hooks' shared lib.sh is analyzed rather than reported unfollowable.
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

  validate-manifests:
    name: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JSON files parse
        # `jq empty <file>` exits non-zero on invalid JSON. Deeper schema-shape
        # validation is Claude Code's own `plugin validate`; this job keeps
        # obvious editor mistakes — missing commas, stray characters — from
        # landing on main.
        #
        # The file list is derived from the marketplace rather than hardcoded, so
        # adding a plugin needs no edit here.
        run: |
          set -euo pipefail
          mapfile -t files < <(
            echo .claude-plugin/marketplace.json
            jq -r '.plugins[].source' .claude-plugin/marketplace.json \
              | while read -r src; do find "$src" -name '*.json'; done
          )
          for f in "${files[@]}"; do
            echo "  $f"
            jq empty "$f"
          done

      - name: Verify every plugin version is semver-parseable
        # Not style policing. Dependency resolution ignores tags whose suffix
        # doesn't parse as semver, so a version like `2026.3` produces a tag that
        # exists and is never selected — the plugin silently drops out of any
        # other plugin's version constraint. Catching it pre-merge is the only
        # place a failure can still block; by release time the bad version is
        # already on main.
        #
        # Leading zeros are rejected by semver, which is why the release
        # workflow emits an unpadded month (`2026.8.1`, never `2026.08.1`).
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r name source; do
            version=$(jq -r .version "${source}/.claude-plugin/plugin.json")
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::${name}: version '${version}' is not semver-parseable"
              fail=1
            else
              echo "  ${name} ${version}"
            fi
          done < <(jq -r '.plugins[] | "\(.name)\t\(.source)"' .claude-plugin/marketplace.json)
          exit "$fail"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflow files
        # This exists because a workflow shipped that could not start. A
        # continuation line at column 0 inside a `run: |` block ended the block
        # scalar and made the file invalid YAML; four checks went green and the
        # first run after merge failed before any job existed. actionlint was
        # confirmed to catch that exact commit.
        #
        # It matters more here than in most repos because PR CI cannot catch a
        # broken workflow by running it — and for `release.yml` it never will,
        # since that one triggers only on push to `main`. Merging is the only way
        # to execute it, so static analysis is the only check available.
        #
        # Beyond syntax, actionlint checks `${{ }}` expressions and contexts —
        # the other way a workflow fails at startup — and runs shellcheck over
        # `run:` blocks, which the repo's other shellcheck job cannot see because
        # that one only scans `.sh` files.
        #
        # The upstream Docker image rather than a third-party wrapper action:
        # one less party to trust, and pinned to the version verified locally.
        uses: docker://rhysd/actionlint:1.7.12

  changelog-fragment:
    name: changelog-fragment
    runs-on: ubuntu-latest
    # PR-only. `ci-required` below accepts `skipped`, so this not running on a
    # push to main doesn't hold the gate open.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check diffs against the merge-base with the base
          # branch, which a shallow clone doesn't have.
          fetch-depth: 0
      - name: Require a fragment for every changed plugin
        # A plugin's version is Claude Code's update cache key — it "skips the
        # update if it matches what's already installed." So a change that
        # merges without a fragment doesn't just lose a release note: the
        # release workflow won't bump that plugin, the version won't move, and
        # every existing install keeps running the old copy until some later
        # release happens to carry the change along. That failure is silent and
        # can sit indefinitely, which is why this is a gate rather than a
        # reminder — and why the PR template alone wasn't enough.
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # The release workflow's own PR edits every released plugin's manifest
          # immediately after deleting the fragments it consumed, so it can never
          # satisfy this gate.
          #
          # Keyed on the branch prefix, NOT on the no-changelog label, because a
          # label cannot work here: `gh pr create --label` can't attach labels at
          # creation — GitHub's createPullRequest mutation doesn't accept them —
          # so gh applies them in a second call, and the `pull_request.opened`
          # payload that triggers this workflow is built with an empty labels
          # array. `labeled` isn't in the default trigger types either, so the
          # later application re-triggers nothing. Relying on the label would
          # leave the release PR failing CI, auto-merge never firing, and the
          # workflow's 15-minute merge-wait timing out — breaking every release,
          # with no self-healing, since re-running replays the original payload.
          case "$HEAD_REF" in
            auto-release/*) echo "release PR — skipping"; exit 0 ;;
          esac

          # Escape hatch for a change with genuinely no user-visible effect — a
          # comment fix inside a skill, a CI tweak that happens to touch a plugin
          # directory.
          #
          # Read from the event payload, which is only usable because `labeled`
          # is in this workflow's trigger types (see `on:` above): applying the
          # label fires a fresh run whose payload contains it. Querying the API
          # instead would need `pull-requests: read`, which this repo's default
          # GITHUB_TOKEN does not have — it fails with "Resource not accessible
          # by integration".
          case ",${LABELS}," in
            *,no-changelog,*) echo "no-changelog label present — skipping"; exit 0 ;;
          esac

          fail=0
          while IFS=$'\t' read -r name source; do
            # Three dots: compare against the merge-base, so unrelated commits
            # landing on the base branch meanwhile don't register as this PR's.
            if [ -z "$(git diff --name-only "origin/${BASE}...HEAD" -- "$source/")" ]; then
              continue
            fi
            if compgen -G "changelog.d/${name}/*.md" >/dev/null; then
              echo "  ok: ${name}"
              continue
            fi
            echo "::error::${name} changed but changelog.d/${name}/ has no fragment. Add one (see changelog.d/README.md), or label this PR no-changelog if it has no user-visible effect."
            fail=1
          done < <(jq -r '.plugins[] | "\(.name)\t\(.source)"' .claude-plugin/marketplace.json)
          exit "$fail"

  ci-required:
    # Single umbrella job. New fanout jobs added above gate merges by being
    # added to `needs:` here.
    if: always()
    needs: [shellcheck, actionlint, validate-manifests, changelog-fragment]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
